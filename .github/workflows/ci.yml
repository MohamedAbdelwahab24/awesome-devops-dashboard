name: CI/CD Pipeline

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

env:
  NODE_VERSION: '18'

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd backend
          npm install

      - name: Run linter
        run: |
          cd backend
          npm run lint || echo "No linter configured"

      - name: Run tests
        run: |
          cd backend
          npm test -- --passWithNoTests

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Run tests
        run: |
          cd frontend
          npm test || echo "No tests configured"

  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker build -t awesome-devops-dashboard-backend:${{ github.sha }} -f backend/Dockerfile .
          docker build -t awesome-devops-dashboard-frontend:${{ github.sha }} -f frontend/Dockerfile .

      - name: Run security scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy image awesome-devops-dashboard-backend:${{ github.sha }}

      - name: Deploy to production
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          echo "Deploying to production..."
          # Add your deployment commands here
          # docker push your-registry/awesome-devops-dashboard-backend:${{ github.sha }}
          # docker push your-registry/awesome-devops-dashboard-frontend:${{ github.sha }}

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'CI/CD Pipeline Failed',
              body: 'The CI/CD pipeline has failed. Please check the logs.',
              labels: ['ci', 'failure']
            });
